{% extends 'layout.html' %}

{% block title %}New Post{% endblock %}

{% block h1 %}Creat a new Post{% endblock %}

{% block main %}
    <form method="post">
        <input type="text" name="title" id="title" placeholder="Post title ..." required>
        <textarea name="content" id="content" placeholder=" Content Caption ..." required></textarea>
        <input type="file" name="image" id="image" accept=".jpg, ,png">
        <input type="submit" value="Save Post">
    </form>
{% endblock %}
